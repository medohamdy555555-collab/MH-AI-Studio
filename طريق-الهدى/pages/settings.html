<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات | طريق الهدى</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
transition:.3s;
}

body{
background:#eef5ef;
padding:20px;
color:#222;
}

body.dark{
background:#121212;
color:white;
}

header{
background:#0f7b45;
color:white;
padding:25px;
text-align:center;
border-radius:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

body.dark .card{
background:#1f1f1f;
color:white;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:20px;
background:#0f7b45;
color:white;
cursor:pointer;
}

.back{
display:block;
margin-top:20px;
text-align:center;
background:white;
padding:15px;
border-radius:15px;
text-decoration:none;
font-size:20px;
color:#0f7b45;
font-weight:bold;
}

body.dark .back{
background:#1f1f1f;
color:white;
}

</style>

</head>

<body>

<header>

<h1>⚙️ الإعدادات</h1>

<p>تخصيص تطبيق طريق الهدى</p>

</header>

<div class="card">

<h2>🌙 الوضع الليلي</h2>

<br>

<button onclick="toggleTheme()">
تبديل الوضع الليلي
</button>

</div>

<a class="back" href="../index.html">
🏠 العودة للرئيسية
</a>

<script>

if(localStorage.getItem("theme")=="dark"){

document.body.classList.add("dark");

}

function toggleTheme(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){

localStorage.setItem("theme","dark");

}else{

localStorage.setItem("theme","light");

}

}

</script>

</body>
</html>
