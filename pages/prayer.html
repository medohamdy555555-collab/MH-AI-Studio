<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة | طريق الهدى</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#eef5ef;
padding:20px;
}

header{
background:#0f7b45;
color:white;
padding:25px;
text-align:center;
border-radius:20px;
margin-bottom:20px;
}

.info{
background:white;
padding:18px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
font-size:20px;
text-align:center;
}

.card{
background:white;
padding:18px;
margin-bottom:12px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
display:flex;
justify-content:space-between;
font-size:22px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#0f7b45;
color:white;
font-size:20px;
margin-top:20px;
}

.back{
display:block;
margin-top:20px;
background:white;
padding:15px;
border-radius:15px;
text-align:center;
text-decoration:none;
font-size:20px;
color:#0f7b45;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>🕌 مواقيت الصلاة</h1>

<p id="city">جارٍ تحديد الموقع...</p>

</header>

<div class="info">
📅 التاريخ الهجري
<br><br>
<span id="hijri">جارٍ التحميل...</span>
</div>

<div class="info">
⏳ الوقت المتبقي للصلاة القادمة
<br><br>
<span id="nextPrayer">جارٍ الحساب...</span>
</div>

<div id="times"></div>

<button onclick="loadPrayer()">
🔄 تحديث
</button>

<a href="../index.html" class="back">
🏠 العودة للرئيسية
</a>

<script>

async function loadPrayer(){

navigator.geolocation.getCurrentPosition(async(pos)=>{

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let url=`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`;

let res=await fetch(url);

let json=await res.json();

let data=json.data;

document.getElementById("city").innerText=data.meta.timezone;

document.getElementById("hijri").innerText=
data.date.hijri.weekday.ar+" "+
data.date.hijri.day+" "+
data.date.hijri.month.ar+" "+
data.date.hijri.year+" هـ";

let t=data.timings;

document.getElementById("times").innerHTML=`

<div class="card"><span>الفجر</span><span>${t.Fajr}</span></div>

<div class="card"><span>الشروق</span><span>${t.Sunrise}</span></div>

<div class="card"><span>الظهر</span><span>${t.Dhuhr}</span></div>

<div class="card"><span>العصر</span><span>${t.Asr}</span></div>

<div class="card"><span>المغرب</span><span>${t.Maghrib}</span></div>

<div class="card"><span>العشاء</span><span>${t.Isha}</span></div>

`;

const prayers=[
["الفجر",t.Fajr],
["الظهر",t.Dhuhr],
["العصر",t.Asr],
["المغرب",t.Maghrib],
["العشاء",t.Isha]
];

let now=new Date();

let next="انتهت مواقيت اليوم";

for(let p of prayers){

let parts=p[1].split(":");

let d=new Date();

d.setHours(parts[0],parts[1],0);

if(d>now){

next=p[0]+" - "+p[1];

break;

}

}

document.getElementById("nextPrayer").innerText=next;

});

}

loadPrayer();

</script>

</body>
</html>
